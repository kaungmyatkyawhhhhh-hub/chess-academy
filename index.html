<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rong's Chess Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a warm private coach — calm, encouraging, uncluttered
   IDEA: a club training table: green felt band, framed tournament board, coach's cards
   PICTURE: the live board in a dark frame, large, on every screen
   COLOUR and TYPE: tournament green #1e3b2c band, classic board squares, coral accent, gold highlight; Archivo
   LAYOUT: band with title and pill tabs, board left / coach cards right, stacking on phones */
:root{color-scheme:light dark;--bg:light-dark(#f6f7f3,#0f1511);--ink:light-dark(#17231b,#e9efea);--soft:light-dark(#5d6c62,#9db0a3);--card:light-dark(#ffffff,#18221b);--line:light-dark(#e3e8e2,#273329);--band:#1e3b2c;--lt:#eeeed2;--dk:#769656;--acc:#e4572e;--gold:#f2c14e;--ok:#2f8f4e;--okbg:light-dark(#e6f4ea,#173222);--bad:#c62f2f;--badbg:light-dark(#fbe9e7,#3a1a17)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Archivo,system-ui,sans-serif;overflow-x:clip}
.top{background:var(--band);background-image:radial-gradient(circle at 85% -20%,rgba(242,193,78,.25),transparent 45%),linear-gradient(135deg,rgba(255,255,255,.05) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.05) 50%,rgba(255,255,255,.05) 75%,transparent 75%);background-size:auto,56px 56px;color:#fff}
header{max-width:1240px;margin:auto;padding:14px max(4vw,16px);display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
h1{font-size:clamp(22px,2.6vw,30px);line-height:1.05;margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.sub{display:none}
nav{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
nav a{flex:none;padding:10px 18px;border-radius:999px;color:#e6f1e9;text-decoration:none;font-weight:600;background:rgba(255,255,255,.08)}
nav a:hover{background:rgba(255,255,255,.16)}
nav a.on{background:#fff;color:var(--band)}
main{max-width:1240px;margin:auto;padding:18px max(4vw,16px) 40px}
.wrap{--bs:min(580px,calc(100vh - 110px),58vw);display:grid;grid-template-columns:minmax(0,var(--bs)) minmax(250px,1fr);gap:24px;align-items:start}
@media(max-width:640px){.wrap{grid-template-columns:minmax(0,1fr);gap:10px}.wrap .frame{width:min(100%,max(240px,calc(100vh - 480px)));margin:0 auto;padding:6px}header{padding:8px 12px;gap:6px}h1{font-size:18px}nav a,.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:10px}
.tile{min-height:58px;padding:6px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.tile b{font-size:18px}.tile span{font-size:10px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tile.done{background:var(--okbg);border-color:transparent}.tile.done span{color:var(--gold)}.tile.now{box-shadow:0 0 0 2px var(--acc)}.tile.lock{opacity:.4;cursor:not-allowed}
.dot.h{background:var(--gold)}
.mute{padding:7px 12px;min-height:34px;font-size:14px}main{padding:10px 12px 24px}.card{padding:12px 14px}.card h2{font-size:18px}.card p{margin-bottom:4px}.kicker{font-size:12px}.dots{margin:4px 0 6px}.msg.ok,.msg.bad,.msg.info{padding:8px 10px;font-size:14px;margin:8px 0}.btns{margin-top:8px}.chips{margin-bottom:6px}.chip{min-height:32px;font-size:13px}.big{font-size:52px}}
.frame{background:#2a4434;padding:12px;border-radius:16px;box-shadow:0 24px 50px -18px rgba(20,40,28,.55),inset 0 1px 0 rgba(255,255,255,.12);width:100%}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;aspect-ratio:1;border-radius:6px;overflow:hidden;user-select:none;touch-action:none;transition:box-shadow .3s}
.board.win{box-shadow:0 0 0 4px var(--gold)}
.sq{position:relative;display:grid;place-items:center;cursor:pointer}
.sq.l{background:var(--lt)}.sq.d{background:var(--dk)}
.sq img{width:92%;height:92%;pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));transition:transform .12s}
.sq.own img{cursor:grab}.sq.own:hover img{transform:translateY(-2px) scale(1.04)}
.sq.lift img{opacity:.25}
.sq .c{position:absolute;font-size:11px;font-weight:800;line-height:1;pointer-events:none}
.sq .r{top:4px;left:5px}.sq .f{bottom:3px;right:5px}
.sq.l .c{color:var(--dk)}.sq.d .c{color:var(--lt)}
.sq.sel,.sq.from,.sq.to{background-image:linear-gradient(rgba(242,193,78,.55),rgba(242,193,78,.55))}
.sq.over{box-shadow:inset 0 0 0 4px rgba(255,255,255,.85)}
.board.names .sq::after{content:attr(data-s);font-size:clamp(10px,2.2vw,15px);font-weight:700;opacity:.55;pointer-events:none}
.sq.l::after{color:var(--dk)}.sq.d::after{color:var(--lt)}
.sq.show{background:#f6d47a !important}
.sq.hit{background:#8fd18f !important}.sq.miss{background:#f08c8c !important}
.ghost{position:fixed;pointer-events:none;z-index:50;transform:translate(-50%,-55%) scale(1.12);filter:drop-shadow(0 10px 8px rgba(0,0,0,.35))}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}.sq img{transition:none}}
.card{background:var(--card);border-radius:16px;padding:22px 24px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -12px rgba(20,40,28,.18)}
.card+.card{margin-top:16px}
.card h2{font-size:24px;line-height:1.15;margin:0 0 10px}
.card h3{font-size:18px;margin:16px 0 6px}
.card p,.card li{margin:0 0 8px}.card ul,.card ol{padding-left:22px;margin:0 0 8px}
.card a{color:var(--acc);font-weight:600}
.msg{border-radius:10px;padding:0;margin:12px 0;font-weight:600}
.msg.ok{background:var(--okbg);color:var(--ok);padding:12px 14px}.msg.bad{background:var(--badbg);color:var(--bad);padding:12px 14px}.msg.info{background:light-dark(#fff6dd,#33290f);color:light-dark(#7a5800,#f2c14e);padding:12px 14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
button{font:inherit;font-weight:600;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:transform .1s}
button:active{transform:scale(.97)}
button.main{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 6px 14px -6px rgba(228,87,46,.7)}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:28px}
.lesson{text-align:left;height:auto;padding:14px 16px;display:flex;gap:12px;align-items:center;width:100%;border:0;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px -12px rgba(20,40,28,.25)}
.lesson .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-weight:800}
.lesson b{display:block;font-size:16px;line-height:1.2}.lesson span.s{color:var(--soft);font-weight:400;font-size:14px}
.lesson.done .n{background:var(--ok);color:#fff}.lesson.cur{box-shadow:0 0 0 2px var(--acc)}.lesson.cur .n{background:var(--acc);color:#fff}
.dots{display:flex;gap:6px;margin:8px 0 12px}.dot{width:26px;height:6px;border-radius:3px;background:var(--line)}.dot.y{background:var(--ok)}.dot.c{background:var(--acc)}
.kicker{font-size:14px;color:var(--soft);font-weight:600}
.big{font-size:clamp(56px,11vw,96px);font-weight:800;line-height:1;margin:8px 0 14px;color:var(--band)}
:root[data-theme=dark] .big{color:var(--gold)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .big{color:var(--gold)}}
.stat{display:flex;gap:28px;flex-wrap:wrap}.stat div{font-size:14px;color:var(--soft)}.stat b{display:block;font-size:30px;color:var(--ink);line-height:1.1}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--ok)}
table{border-collapse:collapse;width:100%;margin:6px 0 14px}td,th{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}th{font-size:14px;color:var(--soft)}
kbd{font:inherit;font-weight:800;background:var(--bg);border-radius:6px;padding:2px 8px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border:0}
.check input{width:22px;height:22px;margin-top:2px;accent-color:var(--ok);flex:none}
.small{font-size:14px;color:var(--soft)}

.chips{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px;margin-bottom:10px;padding:2px}.chip{flex:none}
.chip{min-height:38px;padding:0 12px;border-radius:999px;font-size:14px;border:0;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 12px -8px rgba(20,40,28,.3)}
.chip.on{background:var(--acc);color:#fff}.chip.done:not(.on){color:var(--ok)}
details.card{padding:0}details.card summary{cursor:pointer;padding:14px 20px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.card summary::after{content:'+';font-weight:800;color:var(--soft)}details.card[open] summary::after{content:'–'}
details.card summary::-webkit-details-marker{display:none}details.card .in{padding:0 20px 16px}
.card{padding:18px 20px}.card h2{font-size:22px;margin:0 0 6px}
.big{margin:4px 0 8px}
@media(max-height:700px){main{padding-top:10px}.card{padding:14px 16px}.card h2{font-size:19px}.btns{margin-top:8px}.msg.ok,.msg.bad,.msg.info{padding:8px 12px}.big{font-size:56px}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:10px}
.tile{min-height:58px;padding:6px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.tile b{font-size:18px}.tile span{font-size:10px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tile.done{background:var(--okbg);border-color:transparent}.tile.done span{color:var(--gold)}.tile.now{box-shadow:0 0 0 2px var(--acc)}.tile.lock{opacity:.4;cursor:not-allowed}
.dot.h{background:var(--gold)}
.rbar{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}.rb{width:30px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}.rb.w{background:var(--ok)}.rb.l{background:var(--bad)}.rb.h{background:#c9962b}.rb.cur{background:#3a7bd5}
nav a,.mute{white-space:nowrap}
.mute{border:0;background:rgba(255,255,255,.08);color:#e6f1e9;border-radius:999px;min-height:40px;padding:0 14px}
@media(max-width:600px){.lessons{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px}.lesson{flex:none;width:74vw;scroll-snap-align:start}.frame{padding:7px;border-radius:12px}}
</style>
</head>

</header></div>

 {t:'Read the board',s:'Squares, letters and numbers',body:`<p>Every square has a name: <b>letter first (column a–h), then number (row 1–8)</b>. From White's side, a1 is bottom-left and h8 is top-right.</p>
 <ul><li>Kings start on the <b>e-file</b>: e1 and e8.</li><li>Queens start on the <b>d-file</b>: d1 and d8.</li><li>The centre is d4, e4, d5, e5.</li><li>Playing Black? The board flips, so always read the edge labels.</li></ul>
 <p>Train it in the <a href="#coords">Coordinates</a> tab. Aim for 20+ in 30 seconds.</p>`,p:[]},
 {t:'The blunder check',s:'Stop losing pieces for free',body:`<p><b>Values:</b> pawn 1 · knight 3 · bishop 3 · rook 5 · queen 9.</p>
 <p><b>Before every move, ask:</b></p><ol><li>What did their last move attack?</li><li>After my move, is every piece safe?</li><li>Can I take something for free?</li></ol>
 <p>A defended piece is only safe if the attacker is worth the same or more.</p>`,p:['h1','h2','h3']},
 {t:'Forks',s:'Attack two things at once',body:`<p>A <b>fork</b> is one piece attacking two targets. They can only save one.</p><ul><li><b>Knights</b> are the best forkers. Look for knight checks.</li><li><b>Pawns</b> can fork too, and they're worth only 1.</li><li>Best fork targets: king + rook, king + queen, two minor pieces.</li></ul>`,p:['f1','f2']},
 {t:'Pins and skewers',s:'Attack through a line',body:`<p>A <b>pin</b>: you attack a piece that can't move because something more valuable is behind it (often the king).</p><p>A <b>skewer</b> is the reverse: you attack the valuable piece, it moves, and you take what was behind it.</p><p>Only bishops, rooks and queens can pin or skewer, because they move in lines.</p>`,p:['p1','s1']},
 {t:'Checkmate patterns',s:'Finish the game',body:`<p><b>Back-rank mate:</b> the king is stuck behind its own pawns. Protect yourself by making "luft" (h3 or g3).</p><p><b>Scholar's mate:</b> queen + bishop hit f7, which only the king defends at the start.</p><p><b>Queen + king:</b> the queen gives check, your king covers the escape squares.</p><p>Always look at checks first: Checks → Captures → Threats.</p>`,p:['m1','m4','m2','m3']}
,
 {t:'Discovered attacks',s:'Level 2 · Unmask a hidden attacker',body:`<p>A <b>discovered attack</b>: you move one piece out of the way, and the piece behind it attacks. The moving piece can attack something too, so you get two threats at once.</p><p>If the uncovered piece gives check, it's a <b>discovered check</b>. If both pieces give check, it's a <b>double check</b>: the king MUST move, because nothing can block or capture two checkers.</p>`,p:['d1','d2']},
 {t:'Mate in 2',s:'Level 2 · Force it',body:`<p>Use <b>forcing moves</b>: checks first, then captures, then threats. A check leaves your opponent only a few replies, so you can calculate all of them.</p><p>Sacrifices are fine if every reply leads to mate.</p>`,p:['o2','p1']},
 {t:'Endgame basics',s:'Level 2 · Win the won game',body:`<p><b>Opposition:</b> kings facing each other with one square between. The side that does NOT have to move wins the standoff. Put your king in front of your pawn, not behind it.</p><p><b>Stalemate:</b> if the enemy king has no legal move and isn't in check, it's a draw! When you're winning, always leave the king a square until the mating move.</p>`,p:['e1','q1']},
 {t:'Your openings',s:'Level 2 · London and Caro-Kann',body:`<p><b>White, the London:</b> d4, Bf4, e3, Nf3, c3, Nbd2, Bd3, castle. If Black plays ...Bd6, answer with Bg3.</p><p><b>Black vs 1.e4, the Caro-Kann:</b> c6 then d5. If 3.Nc3 dxe4 4.Nxe4: Bf5, Bg6, Nd7, e6, Ngf6. If 3.e5: Bf5, e6, c5, Nc6.</p><p>Black replies automatically. Play each line until you can do it without hints.</p>`,p:['op1','op2','op3']}
];

function attach(bd,canMove,onMove){
 let drag=null;
 bd.addEventListener('pointerdown',e=>{const sq=e.target.closest('.sq');if(!sq)return;const s=sq.dataset.s;
  if(!canMove(s)){onMove(null,s);return}
  e.preventDefault();const img=sq.querySelector('img');const r=sq.getBoundingClientRect();
  const g=img.cloneNode();g.className='ghost';g.style.width=r.width+'px';g.style.height=r.height+'px';g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';
  document.body.appendChild(g);sq.classList.add('lift');drag={s,g,sq,moved:false,x:e.clientX,y:e.clientY,over:null};
  try{bd.setPointerCapture(e.pointerId)}catch(_){}});
 bd.addEventListener('pointermove',e=>{if(!drag)return;drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';
  if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>6)drag.moved=true;
  const t=document.elementFromPoint(e.clientX,e.clientY);const sq=t&&t.closest?t.closest('#'+bd.id+' .sq'):null;
  if(drag.over&&drag.over!==sq)drag.over.classList.remove('over');if(sq&&sq!==drag.sq){sq.classList.add('over');drag.over=sq}});
 const end=e=>{if(!drag)return;const d=drag;drag=null;d.g.remove();d.sq.classList.remove('lift');if(d.over)d.over.classList.remove('over');
  const t=document.elementFromPoint(e.clientX,e.clientY);const sq=t&&t.closest?t.closest('#'+bd.id+' .sq'):null;
  if(d.moved&&sq&&sq.dataset.s!==d.s)onMove(d.s,sq.dataset.s);else onMove(null,d.s)};
 bd.addEventListener('pointerup',end);bd.addEventListener('pointercancel',e=>{if(drag){drag.g.remove();drag.sq.classList.remove('lift');drag=null}});
}

/* ---------- sound: physically-modelled wood, synthesized in code (no files) ----------
   Modelled on what chess sites use: a short wooden knock for a move, a two-contact "clack" for a capture,
   a brighter harder knock for check, a double knock for castling, a soft bell when you solve, a low "boop" when wrong,
   wood-block ticks for low time, marimba notes for training streaks. */
const SFX={ctx:null,out:null,on:store.sound!==false,buf:{}};
function ac(){if(!SFX.on)return null;try{if(!SFX.ctx){const c=SFX.ctx=new(window.AudioContext||window.webkitAudioContext)();const comp=c.createDynamicsCompressor();comp.threshold.value=-10;const g=c.createGain();g.gain.value=.7;g.connect(comp);comp.connect(c.destination);SFX.out=g;build()}if(SFX.ctx.state==='suspended')SFX.ctx.resume()}catch(e){return null}return SFX.ctx}
/* one wooden impact: damped body modes + board thump + contact click */
function knockInto(x,sr,at,o){const f=o.f,br=o.br||1,v=o.v||1;
 const modes=[[f,1,.055],[f*2.32,.55*br,.03],[f*4.25,.32*br,.018],[f*6.8,.16*br,.01],[o.th||150,.7,.045]];
 const start=Math.floor(at*sr),n=Math.floor(.16*sr);let prev=0;
 for(let i=0;i<n&&start+i<x.length;i++){const t=i/sr;let s=0;
  for(const[mf,ma,md]of modes)s+=ma*Math.sin(2*Math.PI*mf*t)*Math.exp(-t/md);
  const w=Math.random()*2-1,hp=w-prev;prev=w;s+=hp*.9*br*Math.exp(-t/.0016);
  x[start+i]+=v*s*Math.min(1,t/.0008)}}
function mk(len,hits){const c=SFX.ctx,sr=c.sampleRate,b=c.createBuffer(1,Math.floor(len*sr),sr),x=b.getChannelData(0);hits.forEach(h=>knockInto(x,sr,h.at||0,h));
 let pk=0;for(const s of x)pk=Math.max(pk,Math.abs(s));for(let i=0;i<x.length;i++)x[i]*=.9/pk;return b}
function build(){const B=SFX.buf;
 B.move=[700,735,770].map(f=>mk(.2,[{f,br:.9,th:150}]));
 B.capture=[0,1].map(k=>mk(.24,[{f:980+k*40,br:1.35,v:1,th:170},{f:690+k*30,br:.9,v:.75,at:.024,th:140}]));
 B.check=[mk(.26,[{f:1080,br:1.5,th:180},{f:2650,br:.4,v:.25,at:.004}])];
 B.castle=[mk(.32,[{f:720,br:.9},{f:650,br:.9,v:.85,at:.12}])];
 B.tick=[mk(.08,[{f:1900,br:.5,th:900,v:.5}])];B.tock=[mk(.08,[{f:1450,br:.5,th:700,v:.5}])];
 B.pick=[mk(.06,[{f:1600,br:.3,th:400,v:.25}])]}
function pb(name,vol){const c=ac();if(!c)return;const arr=SFX.buf[name];const s=c.createBufferSource();s.buffer=arr[Math.floor(Math.random()*arr.length)];
 s.playbackRate.value=1+(Math.random()-.5)*.06;const g=c.createGain();g.gain.value=(vol||1)*(1+(Math.random()-.5)*.15);s.connect(g);g.connect(SFX.out);s.start()}
function tone(f,t,d,type,v,f2){const c=SFX.ctx,o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(SFX.out);o.start(t);o.stop(t+d+.02)}
/* marimba-like note: fundamental + 4th partial, quick decay */
function mar(f,t,v){tone(f,t,.5,'sine',v);tone(f*3.93,t,.09,'sine',v*.35);tone(f*9.2,t,.025,'sine',v*.12)}
/* soft bell: inharmonic partials */
function bell(f,t,v){[[1,1,1.6],[2.76,.45,.9],[5.4,.2,.5],[8.9,.08,.3]].forEach(([r,a,d])=>tone(f*r,t,d,'sine',v*a))}
const J=()=>1+(Math.random()-.5)*.08;
const play={

 ui(){const c=ac();if(!c)return;const t=c.currentTime;pb('pick',.55);tone(2200*J(),t,.03,'sine',.05)},
 uiMain(){const c=ac();if(!c)return;const t=c.currentTime;pb('pick',.6);mar(784,t,.12);mar(1175,t+.06,.1)},
 nav(){const c=ac();if(!c)return;const t=c.currentTime;mar(587*J(),t,.1);tone(3000,t,.02,'sine',.03)},

 fanfare(){const c=ac();if(!c)return;const t=c.currentTime;[784,988,1175,1568].forEach((f,i)=>mar(f,t+i*.085,.2));bell(1568,t+.38,.14);bell(2349,t+.38,.07)}
};

 <div class="card"><div class="kicker">Difficulty</div><div class="chips" style="margin:6px 0 0">${DIFFS.map(([v,t])=>`<button class="chip${store.diff===v?' on':''}" data-d="${v}">${t}</button>`).join('')}</div><p class="small" style="margin:8px 0 0">Green ✓ solved first try. Gold ✗ needed a hint. Red ✗ missed. Aim to be mostly green: about 70–80% solved is where you learn fastest.</p></div></div></div>`;
 app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{store.diff=+b.dataset.d;save();drawRated()});
 const q=id=>document.getElementById(id);
 if(q('rnext'))q('rnext').onclick=()=>nextRated();
 if(q('rhint'))q('rhint').onclick=()=>{if(!myTurn)return;rp.hint=true;rp.hintSq=P.m.split(' ')[rp.ply].slice(0,2);rp.msg='Hint: move the highlighted piece.';rp.mc='info';drawRated()};
 if(q('rshow'))q('rshow').onclick=()=>{if(!myTurn)return;rp.fail=true;const u=P.m.split(' ')[rp.ply];rMove(u.slice(0,2),u.slice(2,4),true)};
 attach(document.getElementById('rb'),sq=>myTurn&&own(rp.pos[sq]),(from,to)=>{if(!myTurn)return;
  if(!from){if(own(rp.pos[to])){rp.sel=rp.sel===to?null:to;play.pick();drawRated()}if(!rp.sel)return;from=rp.sel}rMove(from,to,false)});
}
function rMove(from,to,shown){const P=rp.cur,M=P.m.split(' '),S=P.s.split(' ');const exp=M[rp.ply];
 if(from+to===exp.slice(0,4)){const cap=!!rp.pos[to];rp.pos=applyU(rp.pos,exp);rp.from=from;rp.to=to;rp.sel=null;rp.hintSq=null;sndSan(S[rp.ply],cap);rp.ply++;
  if(rp.ply>=M.length){rp.solved=true;const win=!rp.fail&&!rp.hint;rateResult(win);rp.msg=win?'✓ Solved!':(rp.fail?'Solution: ':'✓ Solved with a hint. ')+(win?'':S.filter((_,i)=>i%2===1).join(' … '));rp.mc=win?'ok':'info';win?play.correct():play.pick();drawRated();return}
  rp.busy=true;rp.msg=shown?'That was '+S[rp.ply-1]+'.':'✓ '+S[rp.ply-1]+'! Keep going…';rp.mc=shown?'info':'ok';drawRated();setTimeout(()=>{rp.msg='';rOpp()},650);return}
 if(!rp.fail){rp.fail=true}rp.sel=null;play.wrong();rp.msg='Not that one. This puzzle counts as missed, but finish it to learn the idea.';rp.mc='bad';drawRated();document.getElementById('rb').classList.add('shake')}
/* coordinates trainer */
const MODES=[
 {id:'file',t:'1. Columns',d:'Click any square in the named column (letter). No timer.'},
 {id:'rank',t:'2. Rows',d:'Click any square in the named row (number). No timer.'},
 {id:'centre',t:'3. The centre',d:'Only the 16 middle squares (c3 to f6). No timer.'},
 {id:'full',t:'4. Whole board',d:'Any square. No timer: build a streak of 10.'},
 {id:'timed',t:'5. Speed test',d:'Any square, 30 seconds. Aim for 20+.'}
];
let co={side:store.side||'w',mode:store.cmode||'file',names:store.names??true,run:false,score:0,streak:0,target:'',left:30,timer:null,last:null,flash:''};
function rnd(){const m=co.mode;let s;do{
 if(m==='file')s=FILES[Math.floor(Math.random()*8)];
 else if(m==='rank')s=String(1+Math.floor(Math.random()*8));
 else if(m==='centre')s=FILES[2+Math.floor(Math.random()*4)]+(3+Math.floor(Math.random()*4));
 else s=FILES[Math.floor(Math.random()*8)]+(1+Math.floor(Math.random()*8));
}while(s===co.target);return s}
function isHit(sq){const t=co.target;if(co.mode==='file')return sq[0]===t;if(co.mode==='rank')return sq[1]===t;return sq===t}
function viewCoords(){
 const M=MODES.find(m=>m.id===co.mode);const timed=co.mode==='timed';const best=store.best[co.side]||0;
 const label=co.run?(co.mode==='file'?'Click column':co.mode==='rank'?'Click row':'Find square'):(co.last!==null?'Time! Your score':'Press Start');
 app.innerHTML=`<div class="wrap"><div class="frame"><div class="board${co.names?' names':''}" id="cb">${boardHTML(null,{flip:co.side==='b'})}</div></div>
 <div><div class="chips">${MODES.map(m=>`<button class="chip${m.id===co.mode?' on':''}" data-m="${m.id}">${m.t}</button>`).join('')}</div>
 <div class="card"><p class="small" style="margin:0 0 6px">${M.d}</p>
 <div class="kicker">${label}</div><div class="big" id="tg">${co.run?co.target:(co.last!==null?co.last:'—')}</div>
 <div class="msg ${co.flash}" id="fl"></div>
 <div class="stat">${timed?`<div><b id="sc">${co.score}</b>correct</div><div><b id="tm">${co.left}s</b>time left</div><div><b>${best}</b>best as ${co.side==='w'?'White':'Black'}</div>`:`<div><b id="sc">${co.score}</b>correct</div><div><b id="st">${co.streak}</b>streak</div>`}</div>
 <div class="btns"><button class="main" id="go">${co.run?'Restart':'Start'}</button><button id="nm">${co.names?'Hide':'Show'} names</button><button id="side">${co.side==='w'?'Black':'White'} side</button></div></div>
 <details class="card" style="margin-top:12px"><summary>Memory tricks</summary><div class="in"><ul class="small"><li><b>Letters go left → right</b> from White's side: a b c d | e f g h.</li><li><b>Numbers count up from White.</b> White lives on rows 1–2, Black on 7–8.</li><li><b>Kings start on e</b> (e1, e8). <b>Queens on d</b> (d1, d8).</li><li><b>a1 is always dark</b>, White's bottom-left.</li><li>Say each name out loud as you click.</li></ul><p class="small">Learn with names on, then hide them. Next step once your streak hits 10.</p></div></details></div></div>`;
 app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{stopCo();co.mode=b.dataset.m;store.cmode=co.mode;save();co.last=null;co.score=co.streak=0;viewCoords()});
 const cb=document.getElementById('cb');
 cb.onclick=e=>{const sq=e.target.closest('.sq');if(!sq||!co.run)return;const ok=isHit(sq.dataset.s);
  const fl=document.getElementById('fl');
  if(co.mode==='file'||co.mode==='rank')cb.querySelectorAll('.sq').forEach(x=>{if(isHit(x.dataset.s))x.classList.add(ok?'hit':'show')});
  sq.classList.add(ok?'hit':'miss');
  setTimeout(()=>cb.querySelectorAll('.hit,.miss,.show').forEach(x=>x.classList.remove('hit','miss','show')),ok?250:900);
  if(ok){co.score++;co.streak++;play.hit(co.streak-1);co.target=rnd();document.getElementById('tg').textContent=co.target;fl.className='msg';fl.textContent=''}
  else{co.streak=0;play.miss();fl.className='msg bad';fl.textContent='That was '+sq.dataset.s+'.'+(co.mode==='file'||co.mode==='rank'?' The right one is highlighted.':'')}
  document.getElementById('sc').textContent=co.score;const st=document.getElementById('st');if(st)st.textContent=co.streak;
  if(!timed&&co.streak===10){play.fanfare();mark();fl.className='msg ok';fl.textContent='Streak of 10! Try the next step, or hide the names.'}};
 document.getElementById('go').onclick=startCo;
 document.getElementById('nm').onclick=()=>{co.names=!co.names;store.names=co.names;save();const was=co.run;viewCoords();co.run=was};
 document.getElementById('side').onclick=()=>{stopCo();co.last=null;co.side=co.side==='w'?'b':'w';store.side=co.side;save();viewCoords()};
}
function startCo(){stopCo();co.run=true;co.score=0;co.streak=0;co.left=30;co.target=rnd();co.last=null;viewCoords();
 if(co.mode!=='timed')return;
 co.timer=setInterval(()=>{co.left--;if(co.left<=5&&co.left>0)play.tick(co.left);const t=document.getElementById('tm');if(t)t.textContent=co.left+'s';if(co.left<=0){stopCo();play.fanfare();mark();co.last=co.score;co.left=30;if(co.score>(store.best[co.side]||0)){store.best[co.side]=co.score;save()}viewCoords()}},1000)}
function stopCo(){clearInterval(co.timer);co.run=false}

function viewNotation(){
 app.innerHTML=`<div class="wrap"><div class="card"><h2>Pieces</h2>
 <table><tr><th>Letter</th><th>Piece</th><th>Value</th></tr><tr><td><kbd>K</kbd></td><td>King</td><td>—</td></tr><tr><td><kbd>Q</kbd></td><td>Queen</td><td>9</td></tr><tr><td><kbd>R</kbd></td><td>Rook</td><td>5</td></tr><tr><td><kbd>B</kbd></td><td>Bishop</td><td>3</td></tr><tr><td><kbd>N</kbd></td><td>Knight (K is taken by the king)</td><td>3</td></tr><tr><td>none</td><td>Pawn: "e4" is a pawn move</td><td>1</td></tr></table>
 <h2>Symbols</h2><table><tr><td><kbd>x</kbd></td><td>captures: Bxe4 = bishop takes on e4</td></tr><tr><td><kbd>+</kbd></td><td>check</td></tr><tr><td><kbd>#</kbd></td><td>checkmate</td></tr><tr><td><kbd>O-O</kbd></td><td>castle kingside (short)</td></tr><tr><td><kbd>O-O-O</kbd></td><td>castle queenside (long)</td></tr><tr><td><kbd>=Q</kbd></td><td>pawn promotes: e8=Q</td></tr></table></div>
 <div class="card"><h2>Reading a move</h2><p><b>Nf3</b> → knight goes to f3.</p><p><b>Bxe4</b> → bishop captures on e4.</p><p><b>Nbd2</b> → two knights can reach d2, so the extra <b>b</b> says it's the knight from the b-file.</p><p><b>1. e4 c6</b> → move 1: White pawn to e4, Black pawn to c6.</p>
 <h2 style="margin-top:20px">Review marks</h2><table><tr><td><kbd>!!</kbd></td><td>brilliant</td></tr><tr><td><kbd>!</kbd></td><td>great move</td></tr><tr><td><kbd>?!</kbd></td><td>inaccuracy</td></tr><tr><td><kbd>?</kbd></td><td>mistake</td></tr><tr><td><kbd>??</kbd></td><td>blunder</td></tr></table></div></div>`}

const TASKS=[['Coordinates: 5 minutes','Beat your best score from both sides.','#coords'],['Today\'s lesson + puzzles','Finish the next unfinished lesson here.','#lessons'],['20 Lichess theme puzzles','The theme of your current lesson.','https://lichess.org/training/themes'],['3–5 Rapid games (15|10)','Blunder check on every single move.','https://www.chess.com/play/online'],['Review every loss','Find the first ?? or ?, and write it in your tracker Notes.',''],['One video','Naroditsky Speedrun or GothamChess.','https://www.youtube.com/@DanielNaroditskyGM']];
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function streak(){const A=store.active||{};let n=0;const d=new Date();const key=x=>x.getFullYear()+'-'+(x.getMonth()+1)+'-'+x.getDate();
 if(!A[key(d)])d.setDate(d.getDate()-1);while(A[key(d)]){n++;d.setDate(d.getDate()-1)}return n}
const BOOST=["Hikaru lost every game of his first tournament. Losing is part of the path.","You don't need motivation every day, just the habit. Small sessions count.","Rating goes up in stairs, not a smooth line. Flat weeks are normal before a jump.","Every loss you review is a lesson your friends didn't get.","Compare yourself to last week's you, not to anyone else.","Bad day? Do 10 puzzles and stop. Keeping the streak alive is a win.","Magnus studied 3–4 hours a day and still played football. Rest is training too."];
function viewToday(){const k=today();const done=store.days[k]||[];const n=done.filter(Boolean).length;
 const next=LESSONS.findIndex(l=>l.p.length&&!l.p.every(x=>store.solved[x]));
 const solved=Object.keys(store.solved).filter(x=>PZ[x]).length,total=Object.keys(PZ).length;
 const gdone=GLIST.filter(g=>store['game_'+g.id]).length;const lvd=Object.keys(store.lv||{}).length,lvpz=Object.keys(store.lvp||{}).length;
 const xp=solved*10+lvpz*10+lvd*20+gdone*30+(store.best.w||0)+(store.best.b||0)+Object.values(store.days).reduce((s,a)=>s+(a||[]).filter(Boolean).length*5,0);
 const lvl=Math.floor(xp/100)+1,into=xp%100,st=streak();
 const B=[['First puzzle',solved>=1],['Lesson master',ALL.every(x=>store.solved[x])],['Rating hunter',RALL.every(x=>store.solved[x])],['Sharp eyes (20+ coords)',Math.max(store.best.w||0,store.best.b||0)>=20],["Morphy's student",!!store.game_opera],['Level 10',lvd>=10],['Level 50',lvd>=50],['Level 100',lvd>=100],['Level 300',lvd>=300],['3-day streak',st>=3],['7-day streak',st>=7],['30-day streak',st>=30]];
 const tip=BOOST[(new Date().getDate())%BOOST.length];
 app.innerHTML=`<div class="wrap"><div><div class="card"><div class="stat"><div><b>${st}</b>day streak</div><div><b>Level ${lvl}</b>${xp} XP</div><div><b>${solved+lvpz}</b>puzzles solved</div><div><b>${lvd}</b>levels</div><div><b>${store.pr||600}</b>puzzle rating</div></div><div class="bar" style="margin-top:10px"><i style="width:${into}%"></i></div><p class="small" style="margin:0">${100-into} XP to level ${lvl+1}</p></div>
 <div class="card"><h2>Coach's note</h2><p>${tip}</p><h3 style="margin-top:10px">Badges</h3><div class="chips" style="flex-wrap:wrap">${B.map(([t,ok])=>`<span class="chip${ok?' on':''}" style="display:inline-flex;align-items:center;${ok?'':'opacity:.55'}">${ok?'★ ':''}${t}</span>`).join('')}</div></div></div>
 <details class="card" style="margin-top:12px"><summary>Backup and restore progress</summary><div class="in"><p class="small">Progress is saved in this browser. To move it to another browser, device or the website version: Copy code here, then Paste it there.</p><div class="btns"><button id="bk">Copy backup code</button><button id="rs">Restore from code</button></div><textarea id="bkt" rows="3" style="width:100%;margin-top:8px;font:13px monospace;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px" placeholder="Backup code appears here, or paste one to restore"></textarea><div class="msg" id="bkm"></div></div></details></div>
 <div class="card"><h2>Today's training</h2><p class="small">${n} of ${TASKS.length} done. Any one task keeps your streak alive.</p>
 ${TASKS.map((t,i)=>`<label class="check"><input type="checkbox" data-i="${i}" ${done[i]?'checked':''}><span><b>${t[0]}</b><br><span class="small">${t[1]}${t[2]?` · <a href="${t[2]}"${t[2][0]==='#'?'':' target="_blank" rel="noopener"'}>open</a>`:''}</span></span></label>`).join('')}
 <div class="btns"><button class="main" id="golv">Play the next level</button>${next<0?'':`<button id="gol">Lesson ${next}: ${LESSONS[next].t}</button>`}</div></div></div>`;
 const bkt=document.getElementById('bkt'),bkm=document.getElementById('bkm');
 document.getElementById('bk').onclick=()=>{const code='RCA1:'+btoa(unescape(encodeURIComponent(JSON.stringify(store))));bkt.value=code;bkt.select();
  try{navigator.clipboard.writeText(code).then(()=>{bkm.className='msg ok';bkm.textContent='Copied! Paste it into the other version.'},()=>{bkm.className='msg info';bkm.textContent='Select the code above and copy it.'})}catch(e){bkm.className='msg info';bkm.textContent='Select the code above and copy it.'}};
 document.getElementById('rs').onclick=()=>{try{const v=bkt.value.trim();if(!v.startsWith('RCA1:'))throw 0;const s=JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));store=s;
  store.solved=store.solved||{};store.best=store.best||{};store.days=store.days||{};store.lv=store.lv||{};store.lvp=store.lvp||{};store.seen=store.seen||{};store.pr=store.pr||600;save();viewToday();play.fanfare()}catch(e){bkm.className='msg bad';bkm.textContent='That code did not work. Copy the whole code, starting with RCA1:'}};
 app.querySelectorAll('input[data-i]').forEach(c=>c.onchange=()=>{c.checked?play.hit(4):play.pick();const a=store.days[k]||[];a[+c.dataset.i]=c.checked;store.days[k]=a;if(c.checked)mark();save();viewToday()});
 const gl=document.getElementById('golv');if(gl)gl.onclick=()=>{lv.view='level';loadLV(()=>{openLevel(maxUnlocked());location.hash='levels'})};
 const g=document.getElementById('gol');if(g)g.onclick=()=>{state.g=next;state.pi=Math.max(0,LESSONS[next].p.findIndex(x=>!store.solved[x]));CUR=SETS.lessons;resetP();location.hash='lessons'};
}

function route(){stopCo();const h=(location.hash||'#today').slice(1);
 document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+h));
 if(h==='lessons'){CUR=SETS.lessons;viewLessons()}else if(h==='ratings'){CUR=SETS.ratings;viewLessons()}else if(h==='games')viewGames();else if(h==='levels')viewLevels();else if(h==='puzzles')viewRated();else if(h==='coords')viewCoords();else if(h==='notation')viewNotation();else viewToday()}
window.addEventListener('hashchange',route);route();
}
